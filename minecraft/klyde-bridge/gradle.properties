# Klyde Bridge — Fabric mod (server side).
# Build per version by editing these values (or passing -P overrides).
# Supported matrix (see docs/superpowers/specs/2026-11-09-klyde-minecraft-leg-spec.md):
#   Minecraft 26.3 -> fabric_api_version=0.166.2+26.3
#   Minecraft 26.2 -> fabric_api_version=0.161.0+26.2
# (loader/loom identical across both)

minecraft_version=26.3
loader_version=0.20.1
loom_version=1.19-SNAPSHOT
fabric_api_version=0.166.2+26.3

# Yarn mappings build for your Minecraft version — look it up at
# https://fabricmc.net/develop/ (Mappings -> Yarn) for each version.
yarn_mappings=REPLACE_WITH_YARN_BUILD

mod_version=0.1.0
maven_group=dev.klyde
archives_base_name=klyde-bridge
